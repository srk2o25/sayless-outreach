services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations
      - ./db/seed:/docker-entrypoint-initdb.d/seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDING_DOMAIN: ${BREVO_SENDING_DOMAIN}
      LINKEDIN_WORKER_URL: http://linkedin-worker:${LINKEDIN_WORKER_PORT}
      LI_DAILY_CONNECT_CAP: ${LI_DAILY_CONNECT_CAP}
      LI_WEEKLY_CONNECT_CAP: ${LI_WEEKLY_CONNECT_CAP}
      LI_DAILY_VISIT_CAP: ${LI_DAILY_VISIT_CAP}
      LI_MIN_ACCEPT_RATE: ${LI_MIN_ACCEPT_RATE}
      EMAIL_DAILY_CAP_PER_INBOX: ${EMAIL_DAILY_CAP_PER_INBOX}
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows-export

  linkedin-worker:
    build: ./linkedin-worker
    restart: unless-stopped
    environment:
      PORT: ${LINKEDIN_WORKER_PORT}
      LI_DAILY_CONNECT_CAP: ${LI_DAILY_CONNECT_CAP}
      LI_WEEKLY_CONNECT_CAP: ${LI_WEEKLY_CONNECT_CAP}
      LI_DAILY_VISIT_CAP: ${LI_DAILY_VISIT_CAP}
      LI_MIN_ACCEPT_RATE: ${LI_MIN_ACCEPT_RATE}
    ports:
      - "${LINKEDIN_WORKER_PORT}:${LINKEDIN_WORKER_PORT}"
    volumes:
      - linkedin-session:/app/session-state

  admin-ui:
    build: ./admin-ui
    restart: unless-stopped
    environment:
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL}
    ports:
      - "${ADMIN_UI_PORT}:80"
    depends_on:
      - n8n

volumes:
  db-data:
  n8n-data:
  linkedin-session:
