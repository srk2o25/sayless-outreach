server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # linkedin-connection's one documented exception to "admin-ui only talks to
    # n8n" — a live screencast can't be proxied through n8n's webhook model, so
    # this rides the same SSH tunnel already used to reach admin-ui instead of
    # exposing a new port. Port is hardcoded because this file is static,
    # baked into the image at build time — keep in sync with .env's
    # LINKEDIN_WORKER_PORT if that ever changes.
    location /li-connect/ws {
        proxy_pass http://linkedin-worker:4100/li-connect/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Same-origin proxy to n8n's webhook surface only — not the rest of n8n
    # (editor UI, /rest/, credentials). Needed so admin-ui works from a plain
    # browser at outreach.sayless.co.in without every visitor tunneling
    # localhost:5678 themselves, and because Brevo's own webhook callback
    # (email-events) has to reach this from the public internet regardless.
    # n8n's editor stays reachable only via SSH tunnel — see
    # infra/deploy-notes.md.
    location /webhook/ {
        proxy_pass http://n8n:5678/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
