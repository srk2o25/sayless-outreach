server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # linkedin-connection's one documented exception to "admin-ui only talks to
    # n8n" — a live screencast can't be proxied through n8n's webhook model, so
    # this rides the same SSH tunnel already used to reach admin-ui instead of
    # exposing a new port. Port is hardcoded because this file is static,
    # baked into the image at build time — keep in sync with .env's
    # LINKEDIN_WORKER_PORT if that ever changes.
    location /li-connect/ws {
        proxy_pass http://linkedin-worker:4100/li-connect/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
