<!-- ── Sidebar ─────────────────────────────────────────────────────── -->
<nav class="sidebar">
  <div class="sidebar-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
      <path d="M4 12 L20 4 L14 20 L11 13 L4 12Z" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  <ul class="nav-list">
    <li *ngFor="let item of navItems; trackBy: trackByRoute">
      <a class="nav-item" [routerLink]="item.route" routerLinkActive="nav-item--active" [title]="item.label">
        <svg *ngIf="item.route === '/prospects'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="6.5" r="3" />
          <path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6" />
        </svg>
        <svg *ngIf="item.route === '/sequence'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="4" r="1.5" />
          <circle cx="5.5" cy="10" r="1.5" />
          <circle cx="5.5" cy="16" r="1.5" />
          <path d="M8.5 4h7M8.5 10h7M8.5 16h7" />
        </svg>
        <svg *ngIf="item.route === '/batches'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 2.5 17 6.5 10 10.5 3 6.5Z" />
          <path d="M3 10.5 10 14.5 17 10.5" />
          <path d="M3 14.5 10 18.5 17 14.5" />
        </svg>
        <svg *ngIf="item.route === '/linkedin-connection'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="5.5" r="2" />
          <circle cx="14.5" cy="5.5" r="2" />
          <circle cx="10" cy="15" r="2" />
          <path d="M7.1 6.8 8.8 12.6M12.9 6.8 11.2 12.6M7.4 5.5h5.2" />
        </svg>
      </a>
    </li>
  </ul>
</nav>

<!-- ── Main ────────────────────────────────────────────────────────── -->
<div class="main">
  <div class="topbar">
    <span class="topbar-breadcrumb">Cadence</span>
  </div>
  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>
