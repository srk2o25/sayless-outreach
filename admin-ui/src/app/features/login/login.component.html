<div class="login-page">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <div class="login-title">Sayless Outreach</div>
    <p class="login-subtitle">Sign in to continue</p>

    <label class="field">
      <span>Email</span>
      <input type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
    </label>

    <div class="login-error" *ngIf="error">Incorrect email or password.</div>

    <button type="submit" class="login-submit" [disabled]="submitting">
      {{ submitting ? "Signing in…" : "Sign in" }}
    </button>
  </form>
</div>
